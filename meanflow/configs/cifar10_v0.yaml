output_dir: ./tmp
dataset: cifar10
batch_size: 128
lr: 0.0006
eval_frequency: 50
epochs: 16000
compute_fid: true
log_per_step: 100
tr_sampler: v0
P_mean_t: -2.0
P_std_t: 2.0
P_mean_r: -2.0
P_std_r: 2.0
warmup_epochs: 200
norm_p: 0.75
ratio: 0.75
dropout: 0.2
use_edm_aug: true

# wandb logging
use_wandb: false
wandb_key: ""         # wandb API key, or set WANDB_KEY env var
wandb_entity: ""      # wandb username or team, or set WANDB_ENTITY env var
wandb_project: meanflow
wandb_run_name: ""    # auto-generated as "meanflow_<dataset>_b<batch_size>" if empty

# loss weighting
loss_weighting: none   # weighting function name (see models/loss_weighting.py)
use_scale: false       # apply weighting's built-in scale * extra_scale to the loss
extra_scale: null      # extra multiplier on top of built-in scale; null means 1.0
weight_lambda: 1.0    # lambda hyperparameter for vanilla_weighting / straight_weighting

# step-based intervals
ckpt_every: 0         # checkpoint every N steps (0 = epoch-based via eval_frequency)
val_every: 0          # validation every N steps  (0 = epoch-based via eval_frequency)
compute_is: false     # whether to compute Inception Score during eval
is_splits: 10         # splits for IS estimation
