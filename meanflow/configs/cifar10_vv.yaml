output_dir: ./results
dataset: cifar10
batch_size: 128
lr: 0.0006
eval_frequency: 50
epochs: 16000
compute_fid: true
log_per_step: 10
tr_sampler: v1
P_mean_t: -0.6
P_std_t: 1.6
P_mean_r: -4.0
P_std_r: 1.6
warmup_epochs: 200
norm_p: 0.75
ratio: 0.75
dropout: 0.2
use_edm_aug: true

# wandb logging
use_wandb: true
wandb_key: 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  # W&B API key (can also use env var WANDB_KEY)
wandb_entity: 'TAMU-Visual-AI'  # W&B entity name (can also use env var ENTITY)
wandb_project: 'MeanFlow'  # W&B project name (can also use env var PROJECT)
wandb_run_name: ""    # auto-generated as "meanflow_<dataset>_b<batch_size>" if empty

# loss weighting
loss_weighting: none   # weighting function name (see models/loss_weighting.py)
use_scale: false       # apply weighting's built-in scale * extra_scale to the loss
extra_scale: null      # extra multiplier on top of built-in scale; null means 1.0
weight_lambda: 1.0    # lambda hyperparameter for vanilla_weighting / straight_weighting

num_workers: 4
prefetch_factor: 12

# step-based intervals
ckpt_every: 5000         # checkpoint every N steps (0 = epoch-based via eval_frequency)
val_every: 5000          # validation every N steps  (0 = epoch-based via eval_frequency)
compute_is: true     # whether to compute Inception Score during eval
is_splits: 10         # splits for IS estimation
